name: ML Pipeline

on:
  push:
    branches:
      - main

jobs:
  ml-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate dataset
        run: python src/validate.py

      - name: Train model and evaluate quality gate
        run: python src/train.py

      - name: Run application tests
        run: pytest

      - name: Prepare model package
        run: |
          mkdir model-package
          cp artifacts/model.joblib model-package/
          cp artifacts/metrics.json model-package/
          cp src/predict.py model-package/
          cp requirements.txt model-package/

      - name: Upload model package
        uses: actions/upload-artifact@v4
        with:
          name: model-package-${{ github.run_number }}
          path: model-package/